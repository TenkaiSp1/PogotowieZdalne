name: Flutter Nightly Build

on:
  workflow_dispatch:

jobs:
  run-flutter-nightly-build:
    permissions:
      # Nested jobs publish release assets (SBOM, installers).
      contents: write
    uses: ./.github/workflows/flutter-build.yml
    secrets: inherit
    with:
      upload-artifact: true
      upload-tag: "nightly"

  rename-release-assets:
    needs: [run-flutter-nightly-build]
    if: ${{ !cancelled() }}
    permissions:
      contents: write
    uses: ./.github/workflows/rename-release-assets.yml
    with:
      tag: "nightly"
